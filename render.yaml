services:
  - type: web
    # Singapore is Render's closest region to India; regions can't be changed after creation, hence the new name.
    name: thinkwise-realtime-sg
    region: singapore
    runtime: node
    plan: free
    buildCommand: npm ci --workspace @thinkwise/server --workspace @thinkwise/shared
    startCommand: npm run start -w @thinkwise/server
    healthCheckPath: /health
    autoDeploy: true
    # Website-only changes must not restart the game server (that would end live games).
    buildFilter:
      paths:
        - apps/server/**
        - packages/shared/**
        - package.json
        - package-lock.json
        - render.yaml
    envVars:
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY
        value: "1"
      # Every address players open the site from, comma separated, e.g. https://quiz.example.org,https://thinkwise.vercel.app
      - key: ALLOWED_ORIGINS
        sync: false
      # https://<website>/api/internal/game-results
      - key: RESULTS_URL
        sync: false
      # Same value as REALTIME_SECRET on Vercel.
      - key: REALTIME_SECRET
        sync: false
