name: Keep game server awake

# Render's free plan sleeps after 15 minutes without traffic; a cold start makes players wait up to a minute.
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping /health
        run: curl --fail --silent --show-error --retry 5 --retry-delay 10 --retry-all-errors --max-time 90 https://thinkwise-realtime-sg.onrender.com/health
