name: Keep game server awake

# Render's free plan sleeps after 15 minutes without traffic; a cold start makes players wait up to a minute.
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    strategy:
      fail-fast: false
      matrix:
        # The old US server stays awake as a fallback until the Singapore one is in use; remove it after the switch.
        url:
          - https://thinkwise-realtime-sg.onrender.com/health
          - https://thinkwise-realtime.onrender.com/health
    steps:
      - name: Ping ${{ matrix.url }}
        run: curl --fail --silent --show-error --retry 5 --retry-delay 10 --retry-all-errors --max-time 90 "${{ matrix.url }}"
